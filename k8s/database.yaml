
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: newsiq-postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: newsiq-database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: newsiq-database
  template:
    metadata:
      labels:
        app: newsiq-database
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: newsiq-secret
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: newsiq-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: database
spec:
  selector:
    app: newsiq-database
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
