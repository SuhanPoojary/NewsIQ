
apiVersion: apps/v1
kind: Deployment
metadata:
  name: newsiq-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: newsiq-frontend
  template:
    metadata:
      labels:
        app: newsiq-frontend
    spec:
      containers:
        - name: frontend
          image: newsiq-frontend:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: newsiq-frontend
spec:
  selector:
    app: newsiq-frontend
  ports:
    - port: 5173
      targetPort: 5173
  type: ClusterIP
