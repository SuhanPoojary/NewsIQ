
services:
  database:
    image: postgres:16
    container_name: newsiq-database
    environment:
      POSTGRES_USER: newsiq_user
      POSTGRES_PASSWORD: NewsIQ_Reset_2026
      POSTGRES_DB: newsiq_db
    ports:
      - "15432:5432"
    volumes:
      - newsiq_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsiq_user -d newsiq_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: newsiq-backend
    environment:
      DATABASE_URL: postgresql+psycopg://newsiq_user:NewsIQ_Reset_2026@database:5432/newsiq_db
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: newsiq-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  newsiq_data:
